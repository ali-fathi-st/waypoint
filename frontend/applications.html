<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Applications | Waypoint</title>
    <meta
      name="description"
      content="Every role you're pursuing, from saved to offer."
    />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body data-page="applications">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app">
      <!-- Sidebar and mobile menu are added here by js/ui/shell.js -->
      <div id="shell"></div>

      <main id="main" class="main" tabindex="-1">
        <header class="page-header">
          <div>
            <h1>Applications</h1>
            <p class="page-header__desc">
              Every role you're pursuing, from saved to offer.
            </p>
          </div>
          <div class="page-header__actions">
            <a class="btn btn--primary" href="jobs.html?status=shortlisted"
              >Start from a shortlisted job</a
            >
          </div>
        </header>

        <div class="stack">
          <div class="toolbar">
            <div class="tabs" role="tablist" aria-label="View">
              <button
                type="button"
                class="tab"
                role="tab"
                id="tab-board"
                data-view="board"
                aria-selected="true"
              >
                Board
              </button>
              <button
                type="button"
                class="tab"
                role="tab"
                id="tab-table"
                data-view="table"
                aria-selected="false"
              >
                Table
              </button>
            </div>
            <form
              class="toolbar__filters"
              id="filters"
              role="search"
              aria-label="Filter applications"
            >
              <div>
                <label for="f-q" class="toolbar__label">Search</label>
                <input
                  class="input input--search"
                  id="f-q"
                  type="search"
                  placeholder="Title or company"
                  autocomplete="off"
                />
              </div>
              <div>
                <label for="f-status" class="toolbar__label">Status</label>
                <select class="select" id="f-status">
                  <option value="">All statuses</option>
                  <option value="saved">Saved</option>
                  <option value="preparing">Preparing</option>
                  <option value="ready_for_review">Ready for review</option>
                  <option value="applied">Applied</option>
                  <option value="interview">Interview</option>
                  <option value="offer">Offer</option>
                  <option value="rejected">Rejected</option>
                  <option value="withdrawn">Withdrawn</option>
                </select>
              </div>
              <button
                type="button"
                class="btn toolbar__toggle"
                id="f-due"
                aria-pressed="false"
              >
                Follow-ups due
              </button>
            </form>
          </div>

          <div id="error"></div>
          <div id="results" role="tabpanel" aria-labelledby="tab-board"></div>
        </div>
      </main>
    </div>

    <script type="module" src="js/pages/applications.js"></script>
  </body>
</html>
