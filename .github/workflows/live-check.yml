# Runs the real job collector against live job boards (GitHub's servers can
# reach them). Used to check the adapters and find boards that exist.
name: Live source check

on:
  push:
    branches: ["live-check"]
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
          POSTGRES_DB: waypoint
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U waypoint" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://waypoint:waypoint@localhost:5432/waypoint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m db.migrate
      - name: Profile and sources to try
        run: |
          python - <<'PY'
          from app.db import connect
          gh = "jobber benevity wealthsimple neofinancial clio 1password hootsuite thinkific dapperlabs koho ada wattpad tophat freshbooks league ecobee nulogy faire gitlab cloudflare databricks stripe samsara affirm coinbase duolingo figma airtable discord reddit twilio okta elastic mongodb datadog hashicorp".split()
          lv = "plaid palantir spotify attentive koho trulioo clio benevity jobber neofinancial wealthsimple 1password ritual voiceflow cohere shakepay nesto hopper dialogue coveo kinaxis alida leverdemo".split()
          with connect() as db:
              db.execute("UPDATE source_settings SET enabled = true, identifiers = %s WHERE source = 'greenhouse'", (gh,))
              db.execute("UPDATE source_settings SET enabled = true, identifiers = %s WHERE source = 'lever'", (lv,))
              db.execute("""UPDATE candidate_profile SET preferred_titles = '{Data Engineer,Data Analyst,BI Developer,Analytics Engineer,Systems Analyst,IT Analyst}',
                  locations = '{"Edmonton, AB","Calgary, AB"}', work_arrangements = '{remote,hybrid,onsite}', salary_min = 70000,
                  exclusions = '{Senior,Staff,Principal,Director,Manager,Sales}'""")
              for i, s in enumerate(["Python", "SQL", "Power BI", "Power Automate", "Power Apps", "SharePoint", "Azure", "Git", "Excel", "PowerShell", "Active Directory", "Networking", "PostgreSQL", "REST APIs"]):
                  db.execute("INSERT INTO candidate_skills (profile_id, position, name, proficiency) VALUES ('me', %s, %s, 'proficient')", (i, s))
          PY
      - name: Try the check tool
        run: python -m app.ingestion.check greenhouse gitlab nope-not-a-board --show 3
      - name: Collect (first run)
        run: python -m app.ingestion.run
      - name: Collect again (should be all unchanged)
        run: python -m app.ingestion.run
      - name: Report
        run: python scripts/live_report.py
