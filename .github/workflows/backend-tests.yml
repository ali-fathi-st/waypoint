# Runs the backend's tests (pytest) against a throwaway PostgreSQL on every
# push and pull request that touches the backend. Nothing is deployed.
name: Backend tests

on:
  push:
    paths: ["backend/**", "frontend/js/api/contract.js", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "frontend/js/api/contract.js", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
          POSTGRES_DB: waypoint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waypoint" --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://waypoint:waypoint@localhost:5432/waypoint_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
